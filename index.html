<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Secured</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Checkmark Animation Styling */
        .success-icon {
            width: 80px;
            height: 80px;
            background-color: #00d95a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0, 217, 90, 0.25);
        }

        .checkmark {
            width: 32px;
            height: 32px;
            stroke-width: 3;
            stroke: #ffffff;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 0;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #111111;
        }

        p {
            font-size: 16px;
            color: #666666;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .gradient-accent {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: #0095f6;
            color: #ffffff;
            border: 1px solid #0095f6;
        }

        .btn-primary:hover {
            background-color: #0074cc;
            border-color: #0074cc;
        }

        .btn-secondary {
            background-color: #f5f5f5;
            color: #111111;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background-color: #e8e8e8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Correct Checkmark Sign -->
        <div class="success-icon">
            <svg class="checkmark" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- Congratulations Title & Subtext -->
        <h1>Congratulations!</h1>
        <p>Your <span class="gradient-accent">Instagram</span> account is now fully secured. Security checkup settings have been successfully updated.</p>

        <!-- Navigation Buttons -->
        <div class="button-group">
            <!-- Replace 'index.html' with the actual link to your home page -->
            <a href="https://sthvirkr-beep.github.io/instagram/" class="btn btn-primary">Go to Home Page</a>
            <a href="https://instagram.com" class="btn btn-secondary">Back to Instagram</a>
        </div>
    </div>

</body>
</html>
